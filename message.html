        </div>
        
        <button class="continue-btn mt-2 fade-up delay-1" onclick="transitionTo('game.html')">Continue &rarr;</button>

    <audio id="bg-music" loop src="assets/music.mp3"></audio>

    <script src="js/particles.js"></script>

        // Start falling items specific to this page
        startFallingItems(['🌹', '🌸', '🍬', '🍭', '💖', '✨']);
